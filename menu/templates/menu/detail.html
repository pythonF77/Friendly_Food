<div class="dishes">
{% for taom in taomlar %}
  <div class="dish-card">
    <div class="dish-img"><img src="{{ taom.rasm.url }}" alt="{{ taom.nomi }}"></div>
    <div class="dish-body">
      <span class="dish-name">{{ taom.nomi }}</span>
      <span class="dish-price">{{ taom.narxi }} so'm</span>
    </div>
  </div>
{% empty %}
  <section class="menu-card">
    <p>Hozircha menyuda taomlar yo'q.</p>
  </section>
{% endfor %}
</div>
