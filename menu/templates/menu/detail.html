<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ taom.name }} - Do'stlik Oshxonasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --clay: #c1521f;
    --clay-light: #e8763c;
    --olive: #2f3b26;
    --olive-deep: #1c2417;
    --saffron: #e8a33d;
    --cream: #f7ede0;
    --cream-dim: #ecdcc4;
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope', sans-serif; }

  body{
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(232,163,61,0.35), transparent 60%),
      radial-gradient(ellipse 800px 700px at 100% 10%, rgba(193,82,31,0.45), transparent 55%),
      radial-gradient(ellipse 700px 600px at 0% 100%, rgba(232,118,60,0.25), transparent 55%),
      linear-gradient(160deg, var(--olive-deep) 0%, var(--olive) 55%, #24301c 100%);
    background-attachment: fixed;
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .detail-card{
    width: 100%;
    max-width: 460px;
    background: linear-gradient(155deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(232,163,61,0.22);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .detail-image{
    width: 100%;
    aspect-ratio: 1 / 1;
    background-color: rgba(0,0,0,0.2);
    overflow: hidden;
  }

  .detail-image img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .no-image{
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--cream-dim);
    font-style: italic;
    opacity: 0.6;
  }

  .detail-body{
    padding: 32px 28px 30px;
    text-align: center;
  }

  .detail-name{
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.25;
  }

  .price-label{
    font-size: 11px;
    color: rgba(247,237,224,0.5);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .detail-price{
    display: inline-block;
    font-size: 1.7rem;
    font-weight: 800;
    background: linear-gradient(100deg, var(--saffron), var(--clay-light));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 28px;
  }

  .back-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--clay), var(--clay-light));
    box-shadow: 0 8px 30px rgba(193,82,31,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    color: #fff6ea;
    border: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .back-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(193,82,31,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .back-btn svg{ width: 18px; height: 18px; }

  @media (max-width: 480px){
    .detail-body{ padding: 26px 20px 24px; }
    .detail-name{ font-size: 1.35rem; }
    .detail-price{ font-size: 1.5rem; }
  }
</style>
</head>
<body>

  <div class="detail-card">
    <div class="detail-image">
      {% if taom.image %}
        <img src="{{ taom.image.url }}" alt="{{ taom.name }}">
      {% else %}
        <div class="no-image">Rasm mavjud emas</div>
      {% endif %}
    </div>
    <div class="detail-body">
      <h1 class="detail-name">{{ taom.name }}</h1>
      <p class="price-label">Narxi</p>
      <div class="detail-price">{{ taom.price }} so'm</div>

      <a href="{% url 'menu_home' %}" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Menyuga qaytish
      </a>
    </div>
  </div>

</body>
</html>
