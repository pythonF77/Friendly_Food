<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ taom.name }} - Do'stlik Oshxonasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Bosh sahifangizdagi kabi to'q yashil ggradient fon */
            background: linear-gradient(135deg, #1f2d24 0%, #131c16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Premium to'q yashil kartochka */
        .detail-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 480px;
            width: 100%;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Rasm konteyneri - u ham quyuqroq yashil fonda */
        .image-container {
            width: 100%;
            height: 340px;
            border-radius: 20px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Rasmni kesmaydi, boricha qutiga sig'diradi */
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px; /* Chetlari yopishib qolmasligi uchun */
        }

        /* Taom ma'lumotlari qismi */
        .info-container {
            width: 100%;
            text-align: center;
            margin-bottom: 25px;
        }

        .food-name {
            font-size: 1.8rem;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Narx turadigan chiroyli element */
        .food-price {
            display: inline-block;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff7a45; /* Bosh sahifadagi tugma rangi bilan bir xil olovrang-sarg'ish */
            background: rgba(255, 122, 69, 0.1);
            padding: 8px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 122, 69, 0.2);
        }

        /* Izoh yoki qisqacha matn uchun */
        .food-desc {
            font-size: 0.95rem;
            color: #a4b3a8;
            line-height: 1.5;
            margin-top: 15px;
            padding: 0 10px;
        }

        /* Yumaloq va zamonaviy orqaga qaytish tugmasi */
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: #ff7a45; /* Olovrang tugma */
            color: #ffffff;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(255, 122, 69, 0.25);
        }

        .back-btn:hover {
            background: #e05e2b;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 122, 69, 0.35);
        }

        .back-btn svg {
            margin-right: 8px;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
[7/20/2026 9:15 AM] XUSANBOY/خسنبي: /* Telefonlar uchun moslashtirish (Ekran kichrayganda rasm balandligi moslashadi) */
        @media (max-width: 480px) {
            .image-container {
                height: 280px;
            }
            .food-name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="detail-card">

        <div class="image-container">
            {% if taom.image %}
                <img src="{{ taom.image.url }}" alt="{{ taom.name }}">
            {% else %}
                <div style="color: #617567; font-style: italic;">Rasm mavjud emas</div>
            {% endif %}
        </div>

        <div class="info-container">
            <h1 class="food-name">{{ taom.name }}</h1>
            <span class="food-price">{{ taom.price }} so'm</span>
            <p class="food-desc"></p>
        </div>

        <!-- Orqaga qaytish olovrang chiroyli tugmasi -->
        <a href="/" class="back-btn">
            <svg viewBox="0 0 24 24">
                <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.16L13.5,5.5L8,11H20Z"/>
            </svg>
            Menyoga qaytish
        </a>

    </div>

</body>
</html>
